[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "telegram-voice-summary-bot"
version = "0.1.0"
description = "A private Telegram voice inbox with local Whisper transcription and Qwen summaries."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "python-telegram-bot>=22.8,<23",
  "httpx>=0.28,<0.29",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
]

[project.scripts]
voice-summary = "voice_summary_bot.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/voice_summary_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
